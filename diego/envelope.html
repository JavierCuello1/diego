<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Thing...</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:url("background.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        rgba(0,0,0,.80)
    );
}

.content{
    position:relative;
    z-index:2;
    color:white;
    padding:30px;
    max-width:800px;
    animation:fadeIn 2s ease;
}

.small{
    letter-spacing:8px;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    margin-bottom:20px;
}

.envelope{
    font-size:7rem;
    margin-bottom:30px;
    animation:float 3s ease-in-out infinite;
}

.title{
    font-size:clamp(3rem,6vw,6rem);
    font-weight:300;
    margin-bottom:30px;
}

.message{
    font-size:1.2rem;
    color:rgba(255,255,255,.85);
    line-height:1.8;
}

.footer{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.4);
    letter-spacing:4px;
    font-size:.8rem;
    z-index:2;
}

@keyframes float{
    0%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
    100%{
        transform:translateY(0);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>
<body>

<section class="hero">

    <div class="content">

        <div class="small">
            One Last Step
        </div>

        <div class="envelope">
            ✉️
        </div>

        <h1 class="title">
            Open The Envelope
        </h1>

        <div class="message">
            You've made it this far.
            <br><br>
            The answer you've been looking for is no longer on your screen.
            <br><br>
            It's inside the envelope waiting for you.
        </div>

    </div>

    <div class="footer">
        A SPECIAL SURPRISE AWAITS
    </div>

</section>

</body>
</html>
