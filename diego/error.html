<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connection Error</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
}

.hero{
    height:100vh;
    width:100%;
    background:url("london-bg.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    text-align:center;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        rgba(0,0,0,.85)
    );
}

.content{
    position:relative;
    z-index:2;
    color:white;
    max-width:700px;
    padding:40px;
}

.error{
    font-size:6rem;
    font-weight:700;
    opacity:.8;
}

.title{
    font-size:2rem;
    margin-top:10px;
    margin-bottom:20px;
}

.text{
    color:rgba(255,255,255,.75);
    line-height:1.8;
}

.loading{
    margin-top:40px;
    font-size:1rem;
    letter-spacing:3px;
    opacity:.7;
}

.dots::after{
    content:"";
    animation:dots 1.5s infinite;
}

@keyframes dots{
    0%{content:"";}
    33%{content:".";}
    66%{content:"..";}
    100%{content:"...";}
}

</style>
</head>
<body>

<section class="hero">

    <div class="content">

        <div class="error">503</div>

        <h1 class="title">
            Stream Unavailable
        </h1>

        <p class="text">
            We are having trouble connecting to the
            Ariana Grande livestream servers.
        </p>

        <div class="loading">
            Attempting to reconnect<span class="dots"></span>
        </div>

    </div>

</section>

<script>

setTimeout(() => {
    window.location.href = "retry.html";
}, 5000);

</script>

</body>
</html>
