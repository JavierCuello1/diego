<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Eternal Sunshine Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
}

.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:url("background.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        rgba(0,0,0,.75)
    );
}

.content{
    position:relative;
    z-index:2;
    color:white;
}

.subtitle{
    letter-spacing:8px;
    text-transform:uppercase;
    color:rgba(255,255,255,.6);
    margin-bottom:20px;
}

.title{
    font-size:clamp(3rem,7vw,6rem);
    font-weight:300;
}

.hidden{
    margin-top:50px;
    opacity:0;
    transition:1.5s;
}

.hidden.show{
    opacity:1;
}

.message{
    font-size:1.2rem;
    margin-bottom:25px;
}

.final-btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:18px 42px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    letter-spacing:2px;
    transition:.3s;
}

.final-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

</style>
</head>
<body>

<section class="hero">

    <div class="content">

        <div class="subtitle">
            A Special Invitation
        </div>

        <h1 class="title">
            The Eternal Sunshine Experience
        </h1>

        <div class="hidden" id="surprise">

            <div class="message">
                Wait...
                <br><br>
                Don't leave yet 💖
            </div>

            <a href="envelope.html" class="final-btn">
                ONE LAST THING...
            </a>

        </div>

    </div>

</section>

<script>

setTimeout(() => {
    document.getElementById("surprise").classList.add("show");
}, 5000);

</script>

</body>
</html>
