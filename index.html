<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Eternal Sunshine Experience</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    height:100vh;
    overflow:hidden;
}

/* FOTO DE FONDO */
.hero{
    position:relative;
    width:100%;
    height:100vh;
    background:url("background.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CAPA OSCURA */
.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.55),
        rgba(0,0,0,.70)
    );
    backdrop-filter:blur(2px);
}

/* CONTENIDO */
.content{
    position:relative;
    z-index:2;
    text-align:center;
    padding:20px;
}

.subtitle{
    color:rgba(255,255,255,.75);
    letter-spacing:8px;
    text-transform:uppercase;
    font-size:.8rem;
    margin-bottom:20px;
}

.title{
    color:white;
    font-size:clamp(2.5rem,6vw,5rem);
    font-weight:300;
    letter-spacing:3px;
    margin-bottom:50px;
    text-shadow:0 10px 30px rgba(0,0,0,.5);
}

/* BOTÓN MODERNO */
.button{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:18px 42px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:100px;
    font-size:1rem;
    letter-spacing:2px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,.08);

    transition:.35s ease;
}

.button:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.18);
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.footer{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.5);
    letter-spacing:4px;
    font-size:.75rem;
    z-index:2;
}

</style>
</head>
<body>

<section class="hero">

    <div class="content">

        <div class="subtitle">
            A Special Invitation
        </div>

        <h1 class="title">
            The Eternal Sunshine Experience
        </h1>

        <a href="surprise.html" class="button">
            CLICK HERE
        </a>

    </div>

    <div class="footer">
        FOR SOMEONE SPECIAL
    </div>

</section>

</body>
</html>
