<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Retry Connection</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
}

.hero{
    height:100vh;
    width:100%;
    background:url("london-bg.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        rgba(0,0,0,.85)
    );
}

.content{
    position:relative;
    z-index:2;
    color:white;
    max-width:800px;
    padding:40px;
}

.small{
    letter-spacing:6px;
    text-transform:uppercase;
    color:rgba(255,255,255,.5);
    font-size:.8rem;
    margin-bottom:20px;
}

.title{
    font-size:3rem;
    font-weight:300;
    margin-bottom:20px;
}

.text{
    color:rgba(255,255,255,.75);
    line-height:1.8;
    margin-bottom:40px;
}

.retry-btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:18px 42px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    letter-spacing:2px;
    transition:.3s;
}

.retry-btn:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.15);
}

.footer{
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.35);
    letter-spacing:4px;
    font-size:.8rem;
}

</style>
</head>
<body>

<section class="hero">

    <div class="content">

        <div class="small">
            Connection Recovery
        </div>

        <h1 class="title">
            One More Attempt?
        </h1>

        <p class="text">
            The Ariana Grande livestream server appears to be responding again.
            Would you like to retry connecting?
        </p>

        <a href="soldout.html" class="retry-btn">
            RETRY CONNECTION
        </a>

    </div>

    <div class="footer">
        ESTABLISHING SECURE CONNECTION
    </div>

</section>

</body>
</html>
